<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for Tanishka ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="proposal">

        <div class="heart">❤️</div>

        <h1>Hey Tanishka! 🌸</h1>

        <h2>Will You Go on a Date with Me? 🥹❤️</h2>

        <p id="message">I promise it'll be fun! 😊</p>

        <div class="buttons">
            <button id="yesBtn">YES ❤️</button>
            <button id="noBtn">NO 🙈</button>
        </div>

    </div>

    <div id="celebration" class="hidden">

        <h1>🥳 YAY, Tanishka! ❤️</h1>

        <p>
            You just made my day! 🌹
            <br><br>
            Now pick a date for our first date.
        </p>

        <input type="date" id="datePicker">

        <br><br>

        <button id="confirmBtn">Confirm Date ❤️</button>

        <h3 id="selectedDate"></h3>

    </div>
    <audio id="bg-music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" autoplay loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
